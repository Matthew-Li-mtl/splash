# Render Blueprint: one free web service that runs the API and serves the web app.
# Dashboard → New → Blueprint → pick this repo. You'll be asked for MONGO_URI.
services:
  - type: web
    name: splash
    runtime: node
    plan: free
    # Dev dependencies (Vite, esbuild) are needed to build, even in production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: splash
      - key: JWT_SECRET
        generateValue: true
